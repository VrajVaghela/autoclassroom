<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 250px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background-color: #45a049;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #333;
      word-wrap: break-word;
    }
  </style>
</head>

<body>
  <h3>AutoClassroom</h3>
  <button id="triggerBtn">Run</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>

</html>
